<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Answer Honestly 😌</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      overflow: hidden;
      user-select: none;
    }

    .box {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: min(90vw, 420px);
    }

    h1 {
      margin: 0 0 15px;
      font-size: 26px;
      color: #ff2f6d;
    }

    p {
      margin: 0 0 25px;
      font-size: 16px;
      color: #333;
    }

    .btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #noBtn {
      background: #ff2f6d;
      color: #fff;
    }

    #noBtn:active {
      transform: scale(0.95);
    }

    #yesBtn {
      background: #28a745;
      color: #fff;
      position: fixed; /* IMPORTANT */
      z-index: 9999;
    }

    #yesBtn:active {
      transform: scale(0.95);
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #222;
      min-height: 30px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Do you love me? 💖</h1>
    <p>Choose wisely 😏</p>

    <div class="btns">
      <button id="noBtn">NO 😡</button>
      <button id="yesBtn">YES ❤️</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");

    function moveYesButton() {
      const padding = 12;

      // Maximum allowed positions
      const maxX = window.innerWidth - yesBtn.offsetWidth - padding;
      const maxY = window.innerHeight - yesBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      yesBtn.style.left = x + "px";
      yesBtn.style.top = y + "px";
    }

    // Move once initially
    window.addEventListener("load", moveYesButton);
    window.addEventListener("resize", moveYesButton);

    // ✅ Mobile: button runs away BEFORE click
    yesBtn.addEventListener("touchstart", (e) => {
      e.preventDefault(); // stops click
      moveYesButton();
    });

    // ✅ Desktop: runs away on hover
    yesBtn.addEventListener("mouseover", moveYesButton);

    // ✅ If she somehow clicks it, still runs away
    yesBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveYesButton();
    });

    // NO button works normally
    noBtn.addEventListener("click", () => {
      result.innerHTML = "Correct answer 😌💖";
    });
  </script>
</body>
</html>
